# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

# Under 250 characters — the schema's limit.
tone_instructions: >-
  Name the trigger, the code path, and the user-visible consequence for every
  finding. If you cannot name one, do not raise it. No praise, no preamble, no
  restating the diff. Silence beats a nitpick.

reviews:
  profile: assertive
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  high_level_summary_instructions: |
    Write in present tense: "adds", not "added".
    Lead with what changes for an operator using the console, not with the file list.
    Do not restate the PR description back to the author.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        A reader who sees only the title should understand what the PR does.
        Conventional-commit form: <type>(<scope>): <subject>, imperative mood.
    # Quoted: bare `off` is a YAML 1.1 boolean, and this field takes a string.
    description:
      mode: "off"

  tools:
    github-checks:
      timeout_ms: 600000
    # `npm run lint` already gates every PR — a second opinion is duplicate noise.
    eslint:
      enabled: false
    # Docs here are deliberate prose, not linted text.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  path_filters:
    - '!public/**'                  # Vite build output
    - '!package-lock.json'
    - '!src/public/**/*.{png,jpg,jpeg,svg,ico}'

  path_instructions:
    - path: '**/*'
      instructions: |
        ## Evidence, not impressions
        Every finding states the trigger, the code path it runs through, and what
        the operator sees. A finding you cannot express that way is not one. Say
        plainly when you are unsure rather than hedging an assertion.

        ## Comments
        A comment explains why the code is the way it is, never what changed or
        why it changed. Write for a reader who never saw the diff: no narrating
        the change, no "fixes bug X", no "we used to do Y", no restating what the
        code already says. Flag comments that violate this. Prefer no comment to
        one that earns no keep.

        ## Do not ask for these
        - **A CHANGELOG entry.** Release notes come from `git log`.
        - **A bundled Signal K server plugin.** The package is webapp-only by
          design; the alert lifecycle lives in the Signal K server's core alerts
          API, not in this repo.
        - **Depending on `@signalk/server-api` for the alert types.** They are
          vendored in `src/types.ts` until a published release carries them.

        ## Scope
        One logical change per PR. Flag substantial unrelated work and suggest a
        separate PR; a called-out trivial fly-by fix is fine. Do not ask for
        refactoring of code the PR merely touches.

    - path: 'test/**/*.test.ts'
      instructions: |
        Tests run under Vitest with happy-dom. Components are real Lit elements
        rendered into the document; `fetch` and `WebSocket` are stubbed per file.

        ## Judge whether a test can fail
        Value a test that fails when the production change is reverted. Flag
        assertions on source text, on a stub's logged intent rather than recorded
        state, and on internals that an equivalent implementation would change.

    - path: 'src/components/**'
      instructions: |
        Components are Lit 3 elements; reactive properties are declared
        through `static properties`. Lit binds `this`
        to the host for `@event` listeners, so passing a method reference is
        correct there.

        An alert console must not hide an active alarm. Flag any path where a
        render, reconnect or refused request can leave an active alert
        invisible or its audible signal stopped without operator action.

    - path: 'src/services/**'
      instructions: |
        The console is a pure client of the Signal K REST and WebSocket APIs.
        Every request goes through the API base defined in
        `services/alert-service.ts`; flag a component that builds its own
        server URL.

    - path: 'package.json'
      instructions: |
        The package name is the serving path (`/signalk-alert-console/`), and
        the `signalk-webapp` keyword is what makes the server list it. Flag a
        change to either, and any addition of `main` or the
        `signalk-node-server-plugin` keyword.

    - path: '**/*.md'
      instructions: |
        Documentation describes the current state, not development history. Flag
        implementation-status language ("Step 3", "TODO", "currently implemented
        as"), build narratives, and unchecked checklist items.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
